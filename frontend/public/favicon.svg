<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Dark Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18142a" />
      <stop offset="100%" stop-color="#0b0b14" />
    </linearGradient>

    <!-- Vibrant Brand Purple-Blue Gradient -->
    <linearGradient id="f-logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="45%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Accent Sky Blue Gradient -->
    <linearGradient id="f-accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Drop Shadow Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#7c3aed" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Container Box -->
  <rect width="512" height="512" rx="128" fill="url(#bg-grad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="8" />

  <!-- Background Ambient Glow Circle -->
  <circle cx="256" cy="256" r="160" fill="#7c3aed" opacity="0.15" filter="blur(30px)" />

  <!-- Stylized "F" Logo Group -->
  <g filter="url(#glow)">
    <!-- Vertical Spine of "F" -->
    <rect x="140" y="110" width="60" height="292" rx="30" fill="url(#f-logo-grad)" />

    <!-- Top Horizontal Bar of "F" -->
    <rect x="140" y="110" width="232" height="60" rx="30" fill="url(#f-logo-grad)" />

    <!-- Top Bar Accent Pill Dot -->
    <circle cx="342" cy="140" r="18" fill="#38bdf8" />

    <!-- Middle Horizontal Bar of "F" (Slightly shorter & stylish) -->
    <rect x="140" y="226" width="176" height="54" rx="27" fill="url(#f-accent-grad)" />
  </g>
</svg>